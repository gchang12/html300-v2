<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Steve Smith</title>
  </head>
  <body>
    <main class="main">
      <h1>Rolodex Card Demo</h1>
      <div class="rolodex-card">
        <div class="profile identity">
          <img
            src="img/headshot.jpg"
            alt="Picture of Steve Smith"
            >
          <h2>Steve Smith</h2>
          <h3>Project Manager</h3>
        </div>
        <div class="profile details">
          <dl>
            <dt>Company</dt><dd>Front End Dev Co</dd>
            <dt>Experience</dt><dd> 3 Years</dd>
            <dt>School</dt><dd>UW</dd>
            <dt>Major</dt><dd>Marketing</dd>
            <dt>Email</dt><dd>steve@fedc.com</dd>
            <div class="social-link">
              <a href="steve.linkedinprofile.com">
                <img
                  src="img/linkedin.svg"
                  alt="Logo of LinkedIn" >
                <span class="link-text">steve.linkedinprofile.com</span>
              </a>
          </dl>
        </div>
      </div>
    </main>
  </body>
</html>
